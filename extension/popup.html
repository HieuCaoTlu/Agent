<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Trợ lý nộp hồ sơ</title>
<style>
  body { font-family: sans-serif; padding: 14px; width: 320px; }
  h3 { margin: 0 0 10px; font-size: 15px; }
  h4 { margin: 0 0 8px; font-size: 13px; }
  label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; }
  input { width: 100%; padding: 6px; margin-bottom: 10px; box-sizing: border-box; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row input { margin-bottom: 0; }
  button { padding: 7px 12px; cursor: pointer; font-size: 13px; }
  button:disabled { cursor: default; opacity: 0.6; }
  #loginStatus { margin-top: 6px; font-size: 12px; color: #555; }
  #loginStatus.error { color: #c62828; }
  #loginStatus.ok { color: #2f7d32; }
  .connbox { margin-top: 16px; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .dot.connected { background: #2f7d32; }
  .dot.connecting { background: #d9a300; }
  .dot.disconnected, .dot.error { background: #c62828; }
  #connLabel { font-weight: 600; font-size: 13px; }
  #connDetail { margin-top: 6px; font-size: 12px; color: #555; word-break: break-word; }
  #webLinkBox { margin-top: 14px; display: none; }
  #webLinkBox.show { display: block; }
  #webLinkOutput { font-size: 12px; }
  .link-row { display: flex; gap: 8px; }
  .link-row input { flex: 1; margin-bottom: 0; }
  .hint { font-size: 11px; color: #777; margin: 4px 0 0; }
</style>
</head>
<body>
  <h3>Trợ lý nộp hồ sơ — Dịch vụ công</h3>

  <label for="backendHttpUrl">Địa chỉ backend (http/https)</label>
  <input type="text" id="backendHttpUrl" placeholder="https://xxx.ngrok-free.app" />

  <label for="usernameInput">Username</label>
  <input type="text" id="usernameInput" placeholder="Username được admin cấp" />

  <button id="loginBtn">Đăng nhập</button>
  <div id="loginStatus"></div>

  <div id="webLinkBox">
    <h4>Link mở trang trợ lý giọng nói</h4>
    <div class="link-row">
      <input type="text" id="webLinkOutput" readonly />
      <button id="copyWebLinkBtn">Sao chép</button>
    </div>
    <p class="hint">Bấm vào link (hoặc mở trong tab mới) để bắt đầu dùng — không cần đăng nhập lại trong 24 giờ.</p>
  </div>

  <div class="connbox">
    <h4>Trạng thái kết nối extension</h4>
    <div><span class="dot" id="connDot"></span><span id="connLabel">Đang kiểm tra...</span></div>
    <div id="connDetail"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
