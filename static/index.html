<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trợ lý giọng nói AI — Dịch vụ công</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="gov-header">
    <div class="title">
      <strong>Trợ lý giọng nói AI</strong>
      <span>Cổng hỗ trợ dịch vụ công trực tuyến</span>
    </div>
  </header>

  <main>
    <div class="card" id="idleCard">
      <div class="orb" id="idleOrb">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span>
      </div>
      <h1>Trợ lý sẽ lắng nghe và trả lời trực tiếp bằng giọng nói</h1>
      <button id="startBtn">Bắt đầu hỗ trợ</button>

      <a href="/manage.html" class="link-btn">Quản lý dữ liệu thủ tục</a>
    </div>

    <div class="chat-card" id="chatCard" hidden>
      <div class="chat-topbar">
        <div class="wave" id="wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div id="status">Đang lắng nghe...</div>
      </div>

      <div class="chat-log" id="chatLog"></div>

      <button id="submitBtn" hidden>Nộp hồ sơ</button>
      <button id="stopBtn">Kết thúc hỗ trợ</button>
    </div>
  </main>

  <footer>Dịch vụ hỗ trợ bằng trí tuệ nhân tạo — vui lòng đối chiếu thông tin quan trọng với cán bộ.</footer>

  <script src="/app.js"></script>
</body>
</html>
