[project]
name = "voice-ai-mvp"
version = "0.1.0"
description = "Trợ lý giọng nói AI — MVP siêu gọn (Gemini Live API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
