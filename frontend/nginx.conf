# Cấu hình nginx cho bản build production trong Docker (Mục Q).
# Thay thế vai trò của Vite dev server proxy (vite.config.ts) — production
# không chạy Vite, nginx phải tự làm hai việc: phục vụ SPA (fallback về
# index.html cho mọi route client-side) và tiếp sang backend cho /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket giọng nói (K) có thể chạy lâu hơn timeout mặc định của nginx.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
